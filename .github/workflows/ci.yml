name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Build and test with a read-only token; only the release job may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test
        run: cargo test --locked
      - name: Build package
        run: packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: out/*.deb

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deb
          path: out
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"$v\"" Cargo.toml || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml"; exit 1; }
          notes=$(awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {f=0} f' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" out/*.deb --title "ubuntu-ble-wake-fix $GITHUB_REF_NAME" --notes "$notes"
